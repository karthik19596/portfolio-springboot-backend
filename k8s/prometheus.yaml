apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: portfolio
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      - job_name: portfolio-backend
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - backend:8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: portfolio
data:
  backend-alerts.yml: |
    groups:
      - name: portfolio-backend-alerts
        rules:
          - alert: BackendDown
            expr: up{job="portfolio-backend"} < 1
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: Portfolio backend is down
              description: The portfolio backend has been unavailable for more than one minute.
          - alert: BackendHttp5xxErrors
            expr: sum(rate(http_server_requests_seconds_count{job="portfolio-backend",status=~"5.."}[5m])) > 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: Portfolio backend is returning HTTP 5xx errors
              description: The portfolio backend has returned server errors for more than two minutes.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: portfolio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - containerPort: 9090
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: portfolio
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090

apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "portfolio.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zipkin
  template:
    metadata:
      labels:
        app: zipkin
    spec:
      containers:
        - name: zipkin
          image: {{ .Values.monitoring.zipkin.image }}
          ports:
            - containerPort: 9411
          resources:
            {{- toYaml .Values.resources.default | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: zipkin
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: zipkin
  ports:
    - port: 9411
      targetPort: 9411

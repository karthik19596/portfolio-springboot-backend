{{- if and .Values.secrets.create (not .Values.existingSecret.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "portfolio.labels" . | nindent 4 }}
type: Opaque
stringData:
  mysql-root-password: {{ required "secrets.mysqlRootPassword is required" .Values.secrets.mysqlRootPassword | quote }}
  mysql-password: {{ required "secrets.mysqlPassword is required" .Values.secrets.mysqlPassword | quote }}
  jwt-secret: {{ required "secrets.jwtSecret is required" .Values.secrets.jwtSecret | quote }}
  grafana-admin-password: {{ required "grafana.adminPassword is required" .Values.grafana.adminPassword | quote }}
{{- end }}

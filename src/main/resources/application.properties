spring.application.name=portfolio-springboot-backend

# H2 for quick demo (swap to MySQL in production)
spring.datasource.url=jdbc:h2:mem:portfoliodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# MongoDB is disabled by default for quick local demo.
# Enable it with the 'mongo' profile or set audit.log.enabled=true.
audit.log.enabled=false
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration

# JWT
jwt.secret=change-this-to-a-256-bit-secret-key-for-production
jwt.expiration-ms=86400000

# Logging
logging.level.com.premkarthik=INFO

# OpenAPI path
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# MySQL (used by Docker Compose)
spring.datasource.url=jdbc:mysql://localhost:3306/portfoliodb
spring.datasource.username=root
spring.datasource.password=rootpass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# MongoDB enabled
audit.log.enabled=true
spring.data.mongodb.uri=mongodb://localhost:27017/portfolio_audit
# Survive restarts by keeping revoked tokens in MongoDB rather than in memory.
auth.token-denylist.persistent=true
# Override the default profile's Mongo auto-configuration exclusion.
spring.autoconfigure.exclude=

# JWT
jwt.secret=change-this-to-a-256-bit-secret-key-for-production
jwt.expiration-ms=86400000

# OpenAPI path
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Observability
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.prometheus.access=unrestricted
management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.enabled=false
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
